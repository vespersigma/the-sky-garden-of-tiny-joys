<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Soft gradient sky background -->
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90D9"/>
      <stop offset="100%" style="stop-color:#87CEEB"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="16" fill="url(#sky)"/>
  
  <!-- Distant floating islands (tiny) -->
  <ellipse cx="20" cy="30" rx="8" ry="3" fill="#90EE90" opacity="0.5"/>
  <ellipse cx="80" cy="25" rx="6" ry="2" fill="#90EE90" opacity="0.4"/>
  
  <!-- Main floating island -->
  <ellipse cx="50" cy="65" rx="28" ry="10" fill="#2F4F4F"/>
  <ellipse cx="50" cy="62" rx="26" ry="8" fill="#20B2AA"/>
  
  <!-- Teal grass on island -->
  <ellipse cx="50" cy="58" rx="22" ry="5" fill="#48D1CC"/>
  
  <!-- Glowing Azure Heart-Coin (the tiny joy) -->
  <circle cx="50" cy="45" r="12" fill="#00CED1" opacity="0.3"/>
  <circle cx="50" cy="45" r="8" fill="#40E0D0"/>
  <circle cx="50" cy="45" r="5" fill="#7FFFD4"/>
  <circle cx="48" cy="43" r="2" fill="white" opacity="0.7"/>
  
  <!-- Soft clouds/mist below -->
  <ellipse cx="30" cy="85" rx="15" ry="5" fill="white" opacity="0.4"/>
  <ellipse cx="70" cy="88" rx="12" ry="4" fill="white" opacity="0.3"/>
</svg>
