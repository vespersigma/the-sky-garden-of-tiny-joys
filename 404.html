<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Vesper Reader</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
</head>

<body class="daylight">
    <div id="app">
        <nav id="top-nav">
            <div></div>
            <h1 id="novel-title">Vesper Reader</h1>
            <div></div>
        </nav>
        <main id="reader">
            <div id="content">
                <div class="error-card"
                    style="background-color: var(--card-bg); color: var(--text-color); border-color: var(--accent-color);">
                    <h3 style="color: var(--heading-color);">Page Not Found</h3>
                    <p>The chapter you're looking for doesn't exist or has been moved.</p>
                    <a href="./"
                        style="display:inline-block; margin-top:15px; color:var(--accent-color); font-weight:bold; text-decoration:none;">Return
                        to Library →</a>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
