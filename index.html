<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vesper Reader</title>
  <meta name="description" content="An immersive novel reading experience.">
</head>

<body>
  <!-- Loading overlay -->
  <div id="loading-overlay">
    <div class="loading-content">
      <div class="loading-spinner"></div>
      <p id="loading-status">Awakening...</p>
    </div>
  </div>

  <!-- Progress bar -->
  <div id="progress-bar"></div>

  <!-- Top Navigation -->
  <nav id="top-nav">
    <button id="menu-toggle" aria-label="Open menu">
      <span class="dot"></span>
      <span class="dot"></span>
      <span class="dot"></span>
    </button>
    <span id="novel-title">Loading...</span>
    <div id="controls">
      <span id="chapter-info"></span>
      <button id="prev-chapter" aria-label="Previous arc" title="Previous Arc">◄</button>
      <button id="next-chapter" aria-label="Next arc" title="Next Arc">►</button>
      <button id="zen-toggle" aria-label="Zen mode" title="Zen Mode">🧘</button>
      <button id="settings-toggle" aria-label="Settings" title="Settings">⚙️</button>
      <button id="theme-toggle" aria-label="Toggle theme" title="Toggle Theme">🌙</button>
    </div>
  </nav>

  <!-- Sidebar -->
  <div id="overlay"></div>
  <aside id="sidebar" class="hidden">
    <div class="sidebar-header">
      <h2>Chapters</h2>
      <button id="close-menu" aria-label="Close menu">✕</button>
    </div>
    <div id="chapter-list"></div>
  </aside>

  <!-- Main content -->
  <main id="app">
    <div id="content"></div>
  </main>

  <script type="module" src="/src/main.ts"></script>
</body>

</html>
