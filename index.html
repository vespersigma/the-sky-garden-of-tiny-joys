<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Read The Sky-Garden of Tiny Joys - An immersive novel reading experience with the Vesper Reader.">

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="The Sky-Garden of Tiny Joys - Vesper Reader">
    <meta property="og:description"
        content="An immersive novel reading experience. Dive into a world of tiny joys and silent seeds.">
    <meta property="og:image" content="favicon.svg">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="The Sky-Garden of Tiny Joys">
    <meta name="twitter:description" content="An immersive novel reading experience with the Vesper Reader.">

    <title>The Sky-Garden of Tiny Joys - Vesper Reader</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.4/marked.min.js"></script>
    <script>
        // Fallback if marked.js CDN fails
        window.addEventListener('load', function () {
            if (typeof marked === 'undefined') {
                document.getElementById('content').innerHTML =
                    '<div class="error-card"><h3>Library Load Error</h3><p>Failed to load markdown parser. Please check your internet connection and refresh.</p></div>';
                document.getElementById('loading-overlay').style.display = 'none';
            }
        });
    </script>
</head>

<body class="daylight">
    <!-- Reading Progress Bar -->
    <div id="progress-bar"></div>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-status">Resonating with the Ledger...</p>
    </div>

    <div id="app">
        <nav id="top-nav">
            <button id="menu-toggle" aria-label="Open Menu">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </button>
            <h1 id="novel-title">The Sky-Garden of Tiny Joys</h1>
            <div id="controls">
                <div id="font-controls" aria-label="Font Size">
                    <button id="font-decrease" aria-label="Decrease Font">A-</button>
                    <button id="font-increase" aria-label="Increase Font">A+</button>
                </div>
                <button id="theme-toggle" aria-label="Switch Theme">🌙</button>
            </div>
        </nav>

        <aside id="sidebar" class="hidden">
            <div class="sidebar-header">
                <h2>Library</h2>
                <button id="close-menu">×</button>
            </div>
            <div id="chapter-list">
                <!-- Chapters will be injected here -->
            </div>
        </aside>

        <main id="reader">
            <div id="content">
                <!-- Story content will be rendered here -->
            </div>
            <nav id="chapter-nav">
                <button id="prev-chapter" class="nav-btn">Previous</button>
                <div id="chapter-info"></div>
                <button id="next-chapter" class="nav-btn">Next</button>
            </nav>
        </main>

        <div id="overlay" class="hidden"></div>
    </div>
    <script src="reader.js?v=2.0"></script>
</body>

</html>
